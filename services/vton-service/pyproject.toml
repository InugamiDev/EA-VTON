[project]
name = "vton-service"
version = "0.1.0"
description = "EA-VTON virtual try-on inference service"
requires-python = ">=3.11"

dependencies = [
    "fastapi>=0.115.0",
    "uvicorn>=0.34.0",
    "python-multipart>=0.0.22",
    "pillow>=12.0.0",
    "numpy>=2.0.0",
    "opencv-contrib-python>=4.10.0",
    "scikit-image>=0.24.0",
    "torch>=2.5.0",
    "torchvision>=0.20.0",
    "safetensors>=0.4.0",
    "huggingface_hub>=0.20.0",
    "einops>=0.6.0",
    "httpx>=0.28.0",
    "replicate>=1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.8.0",
]

[build-system]
requires = ["setuptools>=75.0"]
build-backend = "setuptools.build_meta"
