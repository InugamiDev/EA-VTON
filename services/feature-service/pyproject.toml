[project]
name = "feature-service"
version = "0.1.0"
description = "EA-VTON feature extraction service (pose, parsing, body embedding)"
requires-python = ">=3.11"

dependencies = [
    "fastapi>=0.115.0",
    "uvicorn>=0.34.0",
    "python-multipart>=0.0.22",
    "pillow>=12.0.0",
    "numpy>=2.0.0",
    "opencv-contrib-python>=4.10.0",
    "torch>=2.5.0",
    "torchvision>=0.20.0",
    "mediapipe>=0.10.30",
    "onnxruntime>=1.19.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.8.0",
]

[build-system]
requires = ["setuptools>=75.0"]
build-backend = "setuptools.build_meta"
