# Size MLP Training Configuration
# PyTorch MLP replacing sklearn GBM for size prediction

model:
  name: size_mlp
  input_dim: 134  # 6 body features + 128 body embedding
  hidden_dims: [256, 256, 128]
  output_dim: 7  # XXS through XXL
  dropout: [0.3, 0.3, 0.2]
  activation: gelu
  normalization: layer_norm

data:
  dataset: data/processed/rtr_body_fit.parquet
  features:
    - height_cm
    - weight_kg
    - bmi
    - age
    - waist_hip_ratio
    - shoulder_hip_ratio
  body_embedding_dim: 128
  test_split: 0.2
  stratify: size_label

training:
  epochs: 100
  batch_size: 256
  lr: 1.0e-3
  optimizer: adamw
  weight_decay: 1.0e-4
  scheduler: cosine
  warmup_epochs: 5

  loss:
    type: ordinal_cross_entropy
    lambda_ordinal: 0.1

  # Vietnamese importance weighting
  importance_weighting:
    enabled: true
    vn_height_mean: 156.2
    vn_height_std: 5.5
    vn_weight_mean: 53.9
    vn_weight_std: 8.0
    clip_min: 0.01
    clip_max: 100.0

evaluation:
  metrics:
    - top1_accuracy
    - within1_accuracy
  vn_test_profiles:
    - {name: "VN Cluster 1", h: 151, w: 46}
    - {name: "VN Cluster 3", h: 156, w: 52}
    - {name: "VN Cluster 4", h: 152, w: 58}

checkpoints:
  dir: training/checkpoints/size_mlp
  keep_last: 3
